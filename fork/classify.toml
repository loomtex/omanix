# Kept shell QML/JS that uses sudo or pkexec, keyed to the patch that removes
# the use (W18). P20 is not in the design's patch table yet (contract issue).
[privilege-shell]
"shell/plugins/panels/tailscale/Service.qml" = "P18"
"shell/plugins/bar/indicators/PasswordlessSudo.qml" = "P7"
"shell/plugins/panels/elsewhen/Model.js" = "P20"

# Non-bin paths: first matching regex (full match) wins.
[[path]]
class = "DROP"
regex = "migrations/.*"
[[path]]
class = "ASSET"
regex = "themes/.*"
[[path]]
class = "DROP"
regex = "shell/plugins/dev-gallery/.*"
[[path]]
class = "ASSET"
regex = "shell/.*"
[[path]]
class = "ASSET"
regex = "applications/.*"
[[path]]
class = "DROP"
regex = "config/autostart/limine-snapper-notify\\.desktop"
[[path]]
class = "ASSET"
regex = "config/.*"
[[path]]
class = "AGENT-INTENT"
regex = "default/agents/.*"
[[path]]
class = "DROP"
regex = "default/(pacman|libalpm|limine|snapper|regions)/.*"
[[path]]
class = "DROP"
regex = "default/systemd/user/omarchy-migrate-notify\\.service"
[[path]]
class = "DROP"
regex = "default/systemd/system/systemd-(pcrlogin@|pcrproduct|tpm2-setup-early)\\.service\\.d/.*"
[[path]]
class = "RE-EXPRESS-IN-NIX"
regex = "default/(systemd|udev|v4l2-relayd|audio|alsa|uwsm|environment\\.d|firefox|chromium)/.*"
[[path]]
class = "DROP"
regex = "default/omarchy/sudo-no-update/.*"
[[path]]
class = "ASSET"
regex = "default/.*"
[[path]]
class = "DROP"
regex = "etc/(sudoers\\.d|mkinitcpio\\.conf\\.d|limine-entry-tool\\.d)/.*"
[[path]]
class = "DROP"
regex = "etc/tmpfiles\\.d/omarchy-nopasswd-sudo\\.conf"
[[path]]
class = "DROP"
regex = "etc/mise/conf\\.d/omarchy-(tools|agent-accounts)\\.toml"
[[path]]
class = "ASSET"
regex = "etc/(fastfetch|mpv|xdg)/.*"
[[path]]
class = "RE-EXPRESS-IN-NIX"
regex = "etc/.*"
[[path]]
class = "DROP"
regex = "install/hardware/(all|pacman|platform-setup)\\.sh"
[[path]]
class = "DROP"
regex = "install/hardware/fix-yt6801-ethernet-adapter\\.sh"
[[path]]
class = "RE-EXPRESS-IN-NIX"
regex = "install/(hardware|user/hardware)/.*"
[[path]]
class = "DROP"
regex = "install/user/(xcompose|language|all)\\.sh|install/user/first-run/setup-agent\\.hook"
[[path]]
class = "RE-EXPRESS-IN-NIX"
regex = "install/user/.*"
[[path]]
class = "RE-EXPRESS-IN-NIX"
regex = "install/.*\\.packages"
[[path]]
class = "DROP"
regex = "install/config/(snapper|all)\\.sh"
[[path]]
class = "RE-EXPRESS-IN-NIX"
regex = "install/(config|login)/.*"
[[path]]
class = "DROP"
regex = "install/.*"
[[path]]
class = "ASSET"
regex = "manual/.*"
[[path]]
class = "ASSET"
regex = "LICENSE"
[[path]]
class = "DROP"
regex = "(logo\\.svg|logo\\.txt|icon\\.png|icon\\.txt|version)"
[[path]]
class = "DROP"
regex = ".*"
