# KEEP-AS-GUI tools that write at runtime, and where (§f.4.4).
# checks.runtime-writers: every KEEP-AS-GUI script with a literal write under
# ~/.config or ~/.local/state has a [[writer]] row. checks.hm-owned-readonly:
# no shipped write site targets an HM-owned file, except the [[pending]]
# rows, each naming the patch that fixes it (stale rows fail the check).
# `dynamic = true` marks a writer whose paths are computed (the scanner
# can't see them); its row is still the record.

[[writer]]
script = "omarchy-font-set"
writes = "overlay/{alacritty.toml,kitty.conf,ghostty.conf,foot.ini}, overlay/fontconfig/fonts.conf via omanix-overlay kv/font (P4, fork/add)"
stick = "omanix.fonts.monospace"
dynamic = true

[[writer]]
script = "omarchy-display-text-size"
writes = "terminal overlays via omanix-overlay kv, .local/state/omanix/shell/shell.toml (P3 + P4, fork/add); gsettings stays app-owned"
stick = "omanix.fonts.size (terminals)"
dynamic = true

[[writer]]
script = "omarchy-agent-account-add"
writes = ".config/omarchy/defaults/agent (the human's own harness default; user data)"

[[writer]]
script = "omarchy-refresh-hyprland"
writes = ".local/state/omarchy/toggles/hypr/ (runtime toggles)"

[[writer]]
script = "omarchy-hyprland-monitor-scaling"
writes = "overlay/hypr/monitors.lua via omanix-overlay hypr-scale (P4, patch 0004)"
stick = "omanix.hyprland.monitors + gdkScale"
dynamic = true

[[writer]]
script = "omarchy-setup-keyboard"
writes = "the keyboard block of overlay/hypr/input.lua via omanix-overlay kb (fork/add omanix_keyboard.py, U28)"
stick = "omanix.input.layouts"
dynamic = true

