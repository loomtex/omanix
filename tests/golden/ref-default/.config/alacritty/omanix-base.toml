[env]
TERM = "xterm-256color"

[[keyboard.bindings]]
action = "Paste"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "Copy"
key = "Insert"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[13;2u"
key = "Return"
mods = "Shift"

[[keyboard.bindings]]
chars = "\u001B[13;4u"
key = "Return"
mods = "Alt|Shift"

[terminal]
osc52 = "CopyPaste"

[window]
decorations = "None"

[window.padding]
x = 14
y = 14
